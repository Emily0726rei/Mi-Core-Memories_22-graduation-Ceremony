<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Core Memories - 22nd Graduation Gashapon Machine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #050515;
            /* 載入主視覺圖片，並提供深藍霓虹漸層作為高質感備用背景 */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(35, 30, 90, 0.6) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(90, 30, 85, 0.5) 0%, transparent 50%),
                url('主視覺.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 霓虹濾鏡層，增加主視覺與扭蛋機的融合度 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 10, 26, 0.45);
            z-index: 1;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 標題霓虹文字 */
        .neon-title {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            color: #ffffff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #a855f7,
                0 0 40px #a855f7,
                0 0 60px #2563eb;
            letter-spacing: 2px;
            margin-bottom: 25px;
            animation: pulse-glow 2.5s infinite alternate;
        }

        @keyframes pulse-glow {
            0% {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #8b5cf6, 0 0 30px #8b5cf6;
                transform: scale(1);
            }
            100% {
                text-shadow: 0 0 10px #fff, 0 0 20px #ec4899, 0 0 40px #ec4899, 0 0 50px #8b5cf6;
                transform: scale(1.02);
            }
        }

        /* 3D 扭蛋機造型 */
        .gashapon-machine {
            width: 360px;
            height: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: transform 0.3s ease;
        }

        /* 手機與窄版螢幕自適應自動縮放，防止破版與滾動條 */
        @media (max-height: 740px) {
            .gashapon-machine {
                transform: scale(0.85);
            }
            .neon-title {
                font-size: 2rem;
                margin-bottom: 15px;
            }
        }
        @media (max-height: 640px) {
            .gashapon-machine {
                transform: scale(0.75);
            }
        }
        @media (max-width: 380px) {
            .gashapon-machine {
                transform: scale(0.8);
            }
        }

        /* 1. 頂蓋 */
        .machine-cap {
            width: 250px;
            height: 55px;
            background: linear-gradient(135deg, #2b4c7e 0%, #172a45 100%);
            border-radius: 40px 40px 10px 10px;
            border: 3px solid #3b82f6;
            box-shadow: 0 -10px 25px rgba(59, 130, 246, 0.4), inset 0 8px 10px rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 10;
        }

        .machine-cap::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 18px;
            background: #3b82f6;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 -2px 10px rgba(59, 130, 246, 0.6);
        }

        /* 2. 圓形大玻璃罩 */
        .globe-container {
            width: 330px;
            height: 310px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.03) 70%, rgba(0, 0, 0, 0.6) 100%);
            border-radius: 50%;
            border: 6px solid rgba(255, 255, 255, 0.15);
            position: relative;
            margin-top: -20px;
            z-index: 8;
            overflow: hidden;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.8),
                inset 0 20px 30px rgba(255, 255, 255, 0.15),
                inset 0 -20px 30px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(1px);
        }

        /* 玻璃耀光 */
        .globe-sheen {
            position: absolute;
            top: 25px;
            left: 50px;
            width: 70px;
            height: 25px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: rotate(-28deg);
            filter: blur(1px);
            pointer-events: none;
        }

        /* 3. 扭蛋機底座 */
        .machine-base {
            width: 320px;
            height: 230px;
            background: linear-gradient(to bottom, #101c2e 0%, #0c1420 100%);
            border-radius: 10px 10px 45px 45px;
            border: 4px solid #1e3a8a;
            margin-top: -30px;
            z-index: 7;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.9),
                inset 0 4px 6px rgba(255, 255, 255, 0.1),
                0 0 20px rgba(29, 78, 216, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            position: relative;
        }

        /* 4. 旋鈕控制面板 */
        .control-panel {
            width: 150px;
            height: 90px;
            background: #080d16;
            border: 3px solid #2563eb;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 15px rgba(37, 99, 235, 0.4);
        }

        /* 5. 旋鈕本體 (可以真的轉動的手把) */
        .crank-handle {
            width: 95px;
            height: 95px;
            position: relative;
            cursor: pointer;
            transform: rotate(0deg);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 12;
        }

        .crank-center {
            width: 34px;
            height: 34px;
            background: radial-gradient(circle, #4b5563 0%, #1f2937 100%);
            border: 3px solid #6b7280;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            z-index: 3;
        }

        .crank-bar {
            width: 90px;
            height: 22px;
            background: linear-gradient(180deg, #9ca3af 0%, #4b5563 50%, #111827 100%);
            border: 2px solid #4b5563;
            border-radius: 11px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .crank-bar::before, .crank-bar::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #2563eb;
            border-radius: 50%;
            top: 2px;
            box-shadow: 0 0 8px #3b82f6;
        }
        .crank-bar::before { left: 4px; }
        .crank-bar::after { right: 4px; }

        /* 6. 出蛋口 */
        .dispenser-gate {
            width: 100px;
            height: 75px;
            background: #04070c;
            border: 3px solid #1e3a8a;
            border-radius: 35px 35px 15px 15px;
            box-shadow: inset 0 10px 15px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: visible;
        }

        /* 內部彩球堆疊 */
        .balls-pile {
            position: absolute;
            width: 100%;
            height: 100%;
            bottom: 0;
            left: 0;
            overflow: hidden;
            border-radius: 50%;
            pointer-events: none;
        }

        .gashapon-ball {
            position: absolute;
            border-radius: 50%;
            box-shadow: 
                inset -6px -6px 12px rgba(0,0,0,0.35),
                inset 8px 8px 12px rgba(255,255,255,0.45),
                0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.05s ease-out;
        }

        /* 當轉動時，內部每顆彩球獨特且隨機的抖動碰撞特效 */
        .shake .gashapon-ball {
            animation: ball-jiggle 0.6s ease-in-out infinite alternate;
        }

        @keyframes ball-jiggle {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(var(--jiggle-x, 8px), var(--jiggle-y, -10px)) scale(0.96); }
        }

        /* 掉落出來的球 */
        .out-ball {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            position: absolute;
            bottom: 5px;
            left: 16px;
            cursor: pointer;
            display: none;
            z-index: 15;
            box-shadow: 
                inset -8px -8px 15px rgba(0,0,0,0.4),
                inset 10px 10px 15px rgba(255,255,255,0.5),
                0 8px 20px rgba(0,0,0,0.6),
                0 0 20px rgba(255, 255, 255, 0.4);
            transform-origin: center;
        }

        /* 彈跳碰撞動畫 */
        @keyframes shake-balls {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-3px, 4px) rotate(-3deg); }
            40% { transform: translate(4px, -3px) rotate(4deg); }
            60% { transform: translate(-4px, 2px) rotate(-3deg); }
            80% { transform: translate(2px, 3px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .shake {
            animation: shake-balls 0.6s ease-in-out infinite;
        }

        /* 掉落物理動畫 */
        @keyframes ball-drop {
            0% {
                transform: translate(0, -220px) scale(0.3);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            65% {
                transform: translate(0, 10px) scale(1.05);
            }
            80% {
                transform: translate(0, -8px) scale(0.95);
            }
            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        .ball-drop-anim {
            display: block !important;
            animation: ball-drop 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 旋鈕滑過發光 */
        .crank-handle:hover .crank-bar {
            filter: brightness(1.2);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);
        }

        /* 投影光幕 modal */
        .backdrop-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 3, 15, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .backdrop-modal.active {
            opacity: 1;
            display: flex;
        }

        /* 投影螢幕卡片 */
        .memory-projector {
            width: 90%;
            max-width: 520px;
            background: rgba(13, 18, 33, 0.85);
            border: 4px solid var(--theme-color, #3b82f6);
            border-radius: 35px;
            padding: 40px;
            text-align: center;
            position: relative;
            transform: scale(0.7);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 
                0 0 40px var(--theme-color, rgba(59, 130, 246, 0.4)),
                inset 0 0 25px rgba(255, 255, 255, 0.05);
        }

        .backdrop-modal.active .memory-projector {
            transform: scale(1);
        }

        /* 完美左右半圓開殼特效 */
        .capsule-break {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            margin-bottom: 25px;
            height: 100px;
        }

        .dome-half {
            width: 50px;
            height: 100px;
            border-radius: 100px 0 0 100px;
            background: linear-gradient(135deg, var(--theme-color, #3b82f6) 0%, rgba(0, 0, 0, 0.7) 100%);
            box-shadow: inset 5px 3px 10px rgba(255,255,255,0.45);
            transform-origin: center right;
        }

        .dome-half.right {
            border-radius: 0 100px 100px 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, var(--theme-color, #3b82f6) 100%);
            box-shadow: inset -5px 3px 10px rgba(255,255,255,0.45);
            transform-origin: center left;
        }

        /* 當彈跳光幕啟用時，左右球殼華麗分裂飛出並消失 */
        .backdrop-modal.active .dome-half {
            animation: break-left 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .backdrop-modal.active .dome-half.right {
            animation: break-right 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes break-left {
            0% { transform: translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateX(-70px) translateY(-20px) rotate(-30deg); opacity: 0; filter: blur(3px); }
        }

        @keyframes break-right {
            0% { transform: translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateX(70px) translateY(20px) rotate(30deg); opacity: 0; filter: blur(3px); }
        }

        /* 繼續按鈕 */
        .pulse-btn {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            color: white;
            padding: 12px 35px;
            border-radius: 25px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s;
            border: 2px solid #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .pulse-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        /* 背景微光 */
        .sparkle-dot {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(1px);
            animation: sparkle-glow 3s infinite alternate;
        }

        @keyframes sparkle-glow {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.3); }
        }

        /* 提示按壓手把 */
        .hint-pulse {
            position: absolute;
            top: -25px;
            background: rgba(37, 99, 235, 0.85);
            color: #ffffff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
            animation: bounce-slow 1.5s infinite;
            white-space: nowrap;
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

<!-- 星空微光背景 -->
<div id="sparkles"></div>

<div class="main-container">
    
    <!-- 畢業主標題 -->
    <div class="text-center">
        <div class="neon-title">22nd Core Memories</div>
        <p class="text-blue-300 tracking-widest text-sm md:text-base font-bold mb-8 uppercase opacity-90">
            — 點擊金屬轉盤 ‧ 抽出屬於你們的璀璨回憶 —
        </p>
    </div>

    <!-- 擬真扭蛋機 -->
    <div class="gashapon-machine">
        
        <!-- 頂部圓蓋 -->
        <div class="machine-cap"></div>

        <!-- 圓形大玻璃球 -->
        <div class="globe-container" id="globe">
            <div class="globe-sheen"></div>
            <!-- 內部彩球堆疊區 -->
            <div class="balls-pile" id="ballsPile"></div>
        </div>

        <!-- 錐形大底座 -->
        <div class="machine-base">
            
            <!-- 手把指示牌 -->
            <div class="hint-pulse" id="turnHint">扭一下！🌀</div>

            <!-- 控制面板 + 旋鈕 -->
            <div class="control-panel">
                <div class="crank-handle" id="crank" onclick="twistCrank()">
                    <div class="crank-bar"></div>
                    <div class="crank-center"></div>
                </div>
            </div>

            <!-- 出蛋口 -->
            <div class="dispenser-gate">
                <!-- 掉落後的蛋 -->
                <div class="out-ball" id="droppedBall" onclick="popMemory()"></div>
            </div>

        </div>

    </div>

    <!-- 底部說明文字 -->
    <p class="text-slate-400 text-xs mt-12 text-center max-w-md leading-relaxed">
        Mi 22nd Graduation Ceremony Capsule Machine<br>
        <span class="opacity-60">© 2026 22nd Microsoft Intern. Memories are Forever.</span>
    </p>

</div>

<!-- 畢業紀念投影光幕 (開獎 modal) -->
<div class="backdrop-modal" id="modalOverlay">
    <div class="memory-projector" id="projectorCard">
        <!-- 左右完美分離開殼特效 -->
        <div class="capsule-break">
            <div class="dome-half" id="leftDome"></div>
            <div class="dome-half right" id="rightDome"></div>
        </div>
        
        <!-- 祝福內容 -->
        <div class="px-2">
            <span class="text-sm font-bold tracking-widest uppercase opacity-60 block mb-1" id="capsuleColorLabel" style="color: var(--theme-color)">CORE MEMORY</span>
            <h2 class="text-2xl md:text-3xl font-black mb-6 text-white tracking-wide" id="partnerName">Partner Name</h2>
            
            <div class="bg-black/40 rounded-2xl p-6 mb-8 border border-white/5 max-h-[220px] overflow-y-auto">
                <p class="text-base md:text-lg leading-relaxed text-slate-100 font-medium whitespace-pre-line" id="partnerMsg">
                    這裡會顯示夥伴留下來最真摯的話語...
                </p>
            </div>
            
            <button class="pulse-btn" onclick="closeProjector()">
                繼續扭回憶 🔮
            </button>
        </div>
    </div>
</div>

    // 繽紛彩球配色
    const neonColors = [
        { main: "#ec4899", label: "Joyful Pink" },     // 櫻花粉
        { main: "#3b82f6", label: "Sadness Blue" },   // 湖水藍
        { main: "#eab308", label: "Golden Joy" },     // 亮金黃
        { main: "#a855f7", label: "Fear Purple" },    // 迷幻紫
        { main: "#10b981", label: "Disgust Green" },  // 薄荷綠
        { main: "#f97316", label: "Anxiety Orange" }, // 夕陽橘
        { main: "#ef4444", label: "Anger Red" },      // 烈焰紅
        { main: "#06b6d4", label: "Cool Teal" },      // 電光藍
        { main: "#14b8a6", label: "Dream Emerald" },  // 翡翠綠
        { main: "#f43f5e", label: "Rose Heart" }      // 玫瑰金
    ];

    let currentRotation = 0;
    let isTwisting = false;
    let activeBallColor = "#3b82f6";

    // 音效合成器
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (type === 'twist') {
                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(100 - (i * 15), audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.12);
                    }, i * 150);
                }
            } else if (type === 'drop') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'pop') {
                const osc = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.18);
                
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.18);

                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
                
                osc.start();
                osc2.start();
                osc.stop(audioCtx.currentTime + 0.18);
                osc2.stop(audioCtx.currentTime + 0.18);
            }
        } catch (e) {
            console.log("Audio play failed:", e);
        }
    }

    // 背景微光
    function initSparkles() {
        const sparklesContainer = document.getElementById('sparkles');
        const count = 35;
        for (let i = 0; i < count; i++) {
            const dot = document.createElement('div');
            dot.className = 'sparkle-dot';
            const size = Math.random() * 4 + 2;
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.left = Math.random() * 100 + 'vw';
            dot.style.top = Math.random() * 100 + 'vh';
            dot.style.animationDelay = Math.random() * 4 + 's';
            dot.style.animationDuration = Math.random() * 3 + 2 + 's';
            
            const colorIndex = Math.floor(Math.random() * neonColors.length);
            dot.style.boxShadow = `0 0 10px ${neonColors[colorIndex].main}`;
            dot.style.backgroundColor = neonColors[colorIndex].main;
            
            sparklesContainer.appendChild(dot);
        }
    }

    // 填充內部彩球，並分配自訂抖動參數
    function fillGlobe() {
        const pile = document.getElementById('ballsPile');
        pile.innerHTML = '';
        const totalBalls = 32;
        
        for (let i = 0; i < totalBalls; i++) {
            const b = document.createElement('div');
            b.className = 'gashapon-ball';
            
            const r = Math.random() * 6 + 32;
            const colorObj = neonColors[Math.floor(Math.random() * neonColors.length)];
            
            const angle = Math.random() * Math.PI;
            const radius = Math.random() * 105;
            const x = 165 + radius * Math.cos(angle) - r;
            const y = 185 + radius * Math.sin(angle) - r;

            b.style.width = (r * 2) + 'px';
            b.style.height = (r * 2) + 'px';
            b.style.left = x + 'px';
            b.style.top = y + 'px';

            // 為每一顆球隨機分配不規則抖動向量，達到真實彈跳效果
            const rx = Math.random() * 20 - 10;
            const ry = Math.random() * 20 - 10;
            b.style.setProperty('--jiggle-x', `${rx}px`);
            b.style.setProperty('--jiggle-y', `${ry}px`);
            b.style.animationDelay = `${Math.random() * 0.15}s`;
            
            b.style.background = `radial-gradient(circle at 35% 35%, #ffffff 0%, ${colorObj.main} 40%, rgba(0, 0, 0, 0.8) 100%)`;
            b.style.boxShadow = `0 4px 10px rgba(0,0,0,0.5), inset -4px -4px 10px rgba(0,0,0,0.4), 0 0 12px ${colorObj.main}33`;
            
            pile.appendChild(b);
        }
    }

    // 旋轉並掉蛋
    function twistCrank() {
        if (isTwisting) return;
        isTwisting = true;

        document.getElementById('turnHint').style.opacity = '0';

        currentRotation += 360;
        document.getElementById('crank').style.transform = `rotate(${currentRotation}deg)`;
        
        playSound('twist');

        const globe = document.getElementById('globe');
        globe.classList.add('shake');

        const dropBall = document.getElementById('droppedBall');
        dropBall.classList.remove('ball-drop-anim');
        dropBall.style.display = 'none';

        const chosenColor = neonColors[Math.floor(Math.random() * neonColors.length)];
        activeBallColor = chosenColor.main;

        dropBall.style.background = `radial-gradient(circle at 30% 30%, #ffffff 0%, ${chosenColor.main} 42%, rgba(0, 0, 0, 0.9) 100%)`;
        dropBall.style.boxShadow = `
            inset -6px -6px 15px rgba(0,0,0,0.6), 
            inset 8px 8px 12px rgba(255,255,255,0.5), 
            0 10px 20px rgba(0,0,0,0.7),
            0 0 15px ${chosenColor.main}88
        `;

        setTimeout(() => {
            globe.classList.remove('shake');
            dropBall.classList.add('ball-drop-anim');
            playSound('drop');
        }, 1200);

        setTimeout(() => {
            isTwisting = false;
        }, 1500);
    }

    // 打開扭蛋投射回憶 (左右完美開殼)
    function popMemory() {
        playSound('pop');

        const randomMessage = messages[Math.floor(Math.random() * messages.length)];
        
        const projector = document.getElementById('projectorCard');
        projector.style.setProperty('--theme-color', activeBallColor);

        document.getElementById('partnerName').innerText = randomMessage.name;
        document.getElementById('partnerMsg').innerText = randomMessage.msg;
        
        document.getElementById('leftDome').style.setProperty('--theme-color', activeBallColor);
        document.getElementById('rightDome').style.setProperty('--theme-color', activeBallColor);

        const modal = document.getElementById('modalOverlay');
        modal.style.display = 'flex';
        setTimeout(() => {
            modal.classList.add('active');
        }, 30);
    }

    // 關閉
    function closeProjector() {
        const modal = document.getElementById('modalOverlay');
        modal.classList.remove('active');
        
        document.getElementById('turnHint').style.opacity = '1';

        setTimeout(() => {
            modal.style.display = 'none';
            const dropBall = document.getElementById('droppedBall');
            dropBall.classList.remove('ball-drop-anim');
            dropBall.style.display = 'none';
        }, 400);
    }

    window.onload = function() {
        initSparkles();
        fillGlobe();
    };
</script>
